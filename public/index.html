<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سحابة المهندس | PI Cloud</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      background: linear-gradient(135deg, #070b19 0%, #0d1b3e 45%, #2b0918 85%, #120610 100%);
      color: #fff;
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 1350px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 22, 48, 0.85);
      backdrop-filter: blur(10px);
      padding: 18px 24px;
      border-radius: 16px;
      border: 1px solid #2563eb;
      box-shadow: 0 0 25px rgba(37, 99, 235, 0.3), 0 0 25px rgba(225, 29, 72, 0.25);
      margin-bottom: 30px;
    }
    header h1 {
      background: linear-gradient(to left, #38bdf8, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    header p { color: #cbd5e1; font-size: 13px; }
    .btn { border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; color: #fff; font-size: 13px; text-decoration: none; transition: 0.25s; }
    .btn-red { background: linear-gradient(135deg, #e11d48, #9f1239); box-shadow: 0 2px 10px rgba(225, 29, 72, 0.4); }
    .btn-red:hover { transform: scale(1.03); }
    .btn-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); padding: 6px 12px; font-size: 12px; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4); }
    .btn-blue:hover { background: #3b82f6; }
    .btn-upload { background: linear-gradient(90deg, #2563eb, #e11d48); width: 100%; margin-top: 10px; padding: 9px; }
    .btn-upload:hover { opacity: 0.9; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
    .card {
      background: rgba(15, 23, 42, 0.85);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-top: 2px solid #3b82f6;
      border-bottom: 2px solid #e11d48;
      border-left: 1px solid rgba(59, 130, 246, 0.3);
      border-right: 1px solid rgba(225, 29, 72, 0.3);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .card h2 {
      color: #60a5fa;
      font-size: 16px;
      border-bottom: 1px solid rgba(244, 63, 94, 0.35);
      padding-bottom: 10px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
    }
    .badge { background: #e11d48; color: #fff; font-size: 12px; padding: 1px 8px; border-radius: 12px; }
    .file-list { max-height: 260px; overflow-y: auto; padding-left: 4px; }
    .file-item {
      background: linear-gradient(90deg, rgba(30, 58, 138, 0.45), rgba(136, 19, 55, 0.35));
      border: 1px solid rgba(96, 165, 250, 0.2);
      padding: 10px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
      transition: 0.2s;
    }
    .file-item:hover { border-color: #f43f5e; transform: translateY(-2px); }
    .file-right { display: flex; align-items: center; gap: 10px; overflow: hidden; margin-left: 8px; }
    .prog-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: cover;
      background: #1e293b;
      border: 1px solid #38bdf8;
      flex-shrink: 0;
    }
    .default-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #e11d48);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      flex-shrink: 0;
    }
    .file-info { overflow: hidden; }
    .file-name { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f8fafc; }
    .file-size { font-size: 11px; color: #93c5fd; margin-top: 2px; }
    .actions { display: flex; gap: 5px; flex-shrink: 0; }
    .empty { text-align: center; color: #94a3b8; font-size: 12px; padding: 26px 0; }
    form { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(59, 130, 246, 0.3); }
    .input-group { margin-bottom: 8px; }
    .input-group label { display: block; font-size: 11px; color: #fca5a5; margin-bottom: 3px; font-weight: bold; }
    input[type="file"] { font-size: 11px; color: #e2e8f0; width: 100%; background: rgba(15, 23, 42, 0.7); padding: 4px; border-radius: 6px; border: 1px solid #334155; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>سحابة المهندس • PI Cloud</h1>
        <p>منصة البرامج وأنظمة التشغيل</p>
      </div>
      <button id="adminBtn" onclick="toggleAdmin()" class="btn btn-red">دخول المشرف</button>
    </header>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    const categories = [
      "برامج ما بعد الفورمات", "برامج الأوفيس Office", "برامج Windows 7", "برامج Windows 8",
      "برامج Windows 10", "برامج Windows 11", "أدوات Linux & Scripts", "الأنظمة والتعريفات"
    ];
    let adminPass = localStorage.getItem('adminPass') || '';

    async function loadFiles() {
      const res = await fetch('/api/files');
      const files = await res.json();
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      categories.forEach(cat => {
        const catFiles = files.filter(f => f.category === cat);
        const filesHtml = catFiles.map(f => {
          const iconHtml = f.icon
            ? `<img src="/downloads/${f.icon}" class="prog-icon" alt="icon">`
            : `<div class="default-icon">📦</div>`;

          return `
            <div class="file-item">
              <div class="file-right">
                ${iconHtml}
                <div class="file-info">
                  <div class="file-name" title="${f.name}">${f.name}</div>
                  <div class="file-size">${f.size}</div>
                </div>
              </div>
              <div class="actions">
                <button onclick="copyInstallCmd(${f.id})" class="btn btn-red" style="padding: 6px 10px; font-size: 12px;">تنصيب</button>
<a href="/downloads/${f.filename}" download="${f.name}" class="btn btn-blue">تحميل</a>
                ${adminPass ? `<button onclick="deleteFile(${f.id})" class="btn btn-red" style="padding:6px 8px;font-size:12px;">حذف</button>` : ''}
              </div>
            </div>
          `;
        }).join('');

        grid.innerHTML += `
          <div class="card">
            <div>
              <h2><span>${cat}</span> <span class="badge">${catFiles.length}</span></h2>
              <div class="file-list">${filesHtml || '<div class="empty">لا توجد ملفات مرفوعة</div>'}</div>
            </div>
            ${adminPass ? `
              <form onsubmit="uploadFile(event, '${cat}')">
                <div class="input-group">
                  <label>1. ملف البرنامج (مطلوب):</label>
                  <input type="file" name="progFile" required>
                </div>
                <div class="input-group">
                  <label>2. صورة مصغرة للبرنامج (اختياري):</label>
                  <input type="file" name="iconFile" accept="image/*">
                </div>
                <button type="submit" class="btn btn-upload">رفع البرنامج والصورة</button>
              </form>
            ` : ''}
          </div>
        `;
      });
      document.getElementById('adminBtn').innerText = adminPass ? 'خروج المشرف' : 'دخول المشرف';
    }

    async function toggleAdmin() {
      if (adminPass) {
        adminPass = '';
        localStorage.removeItem('adminPass');
        loadFiles();
        return;
      }
      const pass = prompt('أدخل كلمة مرور المشرف:');
      if (!pass) return;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
      });
      if (res.ok) {
        adminPass = pass;
        localStorage.setItem('adminPass', pass);
        loadFiles();
      } else alert('كلمة المرور خاطئة!');
    }

    async function uploadFile(e, category) {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerText = 'جاري الرفع...';
      btn.disabled = true;

      const progInput = e.target.querySelector('input[name="progFile"]');
      const iconInput = e.target.querySelector('input[name="iconFile"]');

      const formData = new FormData();
      formData.append('file', progInput.files[0]);
      if (iconInput.files[0]) {
        formData.append('icon', iconInput.files[0]);
      }
      formData.append('category', category);

      await fetch('/api/upload', {
        method: 'POST',
        headers: { 'x-admin-pass': adminPass },
        body: formData
      });
      loadFiles();
    }

    async function deleteFile(id) {
      if (!confirm('متأكد من الحذف؟')) return;
      await fetch('/api/files/' + id, {
        method: 'DELETE',
        headers: { 'x-admin-pass': adminPass }
      });
      loadFiles();
    }

    loadFiles();
    function copyInstallCmd(id) {
  const scriptUrl = `${window.location.origin}/install/${id}`;
  const cmd = `cmd /c "curl -s ${scriptUrl} -o %TEMP%\\i.bat && %TEMP%\\i.bat"`;

  const tempInput = document.createElement('textarea');
  tempInput.value = cmd;
  document.body.appendChild(tempInput);
  tempInput.select();
  document.execCommand('copy');
  document.body.removeChild(tempInput);

  alert('✅ تم نسخ أمر التنصيب السريع!\n\n1. اضغط (Win + R)\n2. اضغط (Ctrl + V) ثم (Enter)');
}
  </script>
</body>
</html>
